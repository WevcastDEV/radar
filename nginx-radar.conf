# ==============================================================================
# Configuração do Nginx para o Radar de Oportunidades PRO
# Caminho sugerido na VPS: /etc/nginx/sites-available/radar.seu-dominio.com
# ==============================================================================

server {
    listen 80;
    server_name seudominio.com www.seudominio.com; # Substitua pelo seu domínio ou IP da VPS

    client_max_body_size 50M;

    # 1. Roteamento do Backend API & WebSockets do WhatsApp (Porta 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Cabeçalhos essenciais para WebSockets do WhatsApp (Baileys/Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts longos para manter o WebSocket ativo sem desconectar
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Roteamento do Frontend Next.js (Porta 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
