services:
  - type: web
    name: radar-whatsapp-api
    env: node
    plan: starter
    region: ohio
    buildCommand: npm install && cd packages/database && npx prisma generate && cd ../../apps/api && npm run build
    startCommand: cd apps/api && node dist/main.js
    disk:
      name: radar-data
      mountPath: /app/apps/api/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./radar.db
      - key: JWT_SECRET
        generateValue: true
